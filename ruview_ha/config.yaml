name: RuView HA
slug: ruview_ha
description: WiFi-based presence, fall detection, and vitals monitoring — no cameras.
version: 0.1.3
init: false
url: https://github.com/ernet1/ruview-ha-addon
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:wifi
homeassistant: 2024.1.0
host_network: true
options:
  log_level: info
  scan_interval: 1
  intrusion_mode: false
schema:
  log_level: list(debug|info|warning|error)
  scan_interval: int(1,10)
  intrusion_mode: bool
